[package]
name = "mock_device_signer"
version = "1.0.0"
edition = "2021"
rust-version = "1.89"

[workspace]
resolver = "3"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
serde_json = "1"
logos-signer-interface = { git = "https://github.com/logos-co/logos-signer-interface", rev = "752b7bd69a79ead110efccab40a64731535187f5", features = ["mock"] }
logos-rust-sdk = { path = "../logos-rust-sdk-src", optional = true }

[features]
default = ["logos_module"]
logos_module = ["dep:logos-rust-sdk"]
